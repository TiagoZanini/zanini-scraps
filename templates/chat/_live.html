{# Atualização ao vivo da conversa. Espera: #chat-box com mensagens [data-id], form #chat-form,
   variáveis CHAT_LISTING, CHAT_OTHER e a função renderMsg(m) definida pela página. #}
<script>
(function () {
  var box = document.getElementById('chat-box'), form = document.getElementById('chat-form');
  if (!box || !form) return;
  function lastId() { var n = box.querySelectorAll('[data-id]'); return n.length ? parseInt(n[n.length - 1].dataset.id, 10) : 0; }
  function nearBottom() { return box.scrollHeight - box.scrollTop - box.clientHeight < 80; }
  function bottom() { box.scrollTop = box.scrollHeight; }
  var busy = false;
  function poll(force) {
    if (busy) return; busy = true;
    fetch('/chat/poll?listing=' + CHAT_LISTING + '&other=' + CHAT_OTHER + '&after=' + lastId(), {credentials: 'same-origin'})
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (msgs) {
        if (msgs.length) {
          var colar = force || nearBottom();
          var vazio = box.querySelector('.chat-empty'); if (vazio) vazio.remove();
          msgs.forEach(function (m) { if (!box.querySelector('[data-id="' + m.id + '"]')) box.appendChild(renderMsg(m)); });
          if (colar) bottom();
        }
      }).catch(function () {}).then(function () { busy = false; });
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var input = form.querySelector('[name=content]'), txt = input.value.trim();
    if (!txt) return;
    var fd = new FormData(form); input.value = ''; input.focus();
    fetch(form.action, {method: 'POST', body: fd, credentials: 'same-origin', headers: {'X-Requested-With': 'fetch'}})
      .then(function () { poll(true); }).catch(function () { input.value = txt; });
  });
  bottom();
  setInterval(function () { if (!document.hidden) poll(false); }, 4000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(false); });
})();
</script>
