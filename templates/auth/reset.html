{% extends "base.html" %}
{% block title %}Nova senha - {{ platform_name }}{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-symbol">{% include "_symbol.html" %}</div>
        <div class="auth-wordmark">Zanini Scraps</div>
        <p class="subtitle">Crie uma nova senha para {{ email }}.</p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label">Nova senha</label>
                <input type="password" name="password" class="form-control" minlength="6" placeholder="Mínimo 6 caracteres" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Repita a nova senha</label>
                <input type="password" name="password2" class="form-control" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Salvar nova senha</button>
        </form>
    </div>
</div>
{% endblock %}
