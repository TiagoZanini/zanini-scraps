{% extends "base.html" %}
{% block title %}Meu Perfil - {{ platform_name }}{% endblock %}
{% block content %}
<div class="container page-content">
    <div class="page-header">
        <h1 class="page-title">Meu Perfil</h1>
        <p class="page-subtitle">Gerencie seus dados cadastrais</p>
    </div>
    <div style="max-width:640px;">
        <form method="POST" enctype="multipart/form-data">
            <div class="card" style="margin-bottom:24px;">
                <div class="card-header">Dados Pessoais</div>
                <div class="card-body">
                    <div class="form-group">
                        <label class="form-label">Nome / Razão Social</label>
                        <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">E-mail</label>
                            <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Telefone</label>
                            <input type="text" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Avatar</label>
                        <input type="file" name="avatar" class="form-control" accept="image/*">
                    </div>
                </div>
            </div>
            <div class="card" style="margin-bottom:24px;">
                <div class="card-header">Endereço</div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">CEP</label>
                            <input type="text" name="cep" class="form-control" value="{{ current_user.cep or '' }}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Estado</label>
                            <select name="state" class="form-control">
                                <option value="">Selecione</option>
                                {% for uf in ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'] %}
                                <option value="{{ uf }}" {{ 'selected' if current_user.state == uf }}>{{ uf }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Cidade</label>
                        <input type="text" name="city" class="form-control" value="{{ current_user.city or '' }}">
                    </div>
                    <div class="form-row">
                        <div class="form-group" style="flex:3;">
                            <label class="form-label">Rua</label>
                            <input type="text" name="street" class="form-control" value="{{ current_user.street or '' }}">
                        </div>
                        <div class="form-group" style="flex:1;">
                            <label class="form-label">Número</label>
                            <input type="text" name="number" class="form-control" value="{{ current_user.number or '' }}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Bairro</label>
                        <input type="text" name="neighborhood" class="form-control" value="{{ current_user.neighborhood or '' }}">
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Salvar Alterações</button>
        </form>
    </div>
</div>
{% endblock %}
