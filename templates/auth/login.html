{% extends "base.html" %}
{% block title %}Entrar - {{ platform_name }}{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div style="text-align:center; margin-bottom:24px;">
            <div style="font-size:40px;">♻</div>
        </div>
        <h1>Bem-vindo de volta</h1>
        <p class="subtitle" style="color:var(--accent);font-weight:600;">Onde sua sobra vira matéria-prima.</p>
        <form method="POST">
            <div class="form-group">
                <label class="form-label">E-mail</label>
                <input type="email" name="email" class="form-control" placeholder="seu@email.com" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Senha</label>
                <input type="password" name="password" class="form-control" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Entrar</button>
        </form>
        <div class="auth-divider">ou</div>
        <a href="{{ url_for('register') }}" class="btn btn-secondary btn-block">Criar Conta Gratuita</a>
    </div>
</div>
{% endblock %}
