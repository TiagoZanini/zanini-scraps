{% extends "base.html" %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="page-content" style="display: flex; align-items: center; justify-content: center; min-height: 60vh;">
    <div style="text-align: center; max-width: 500px; margin: auto;">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 5rem; color: var(--danger); margin: 0; font-weight: 700;">403</h1>
        </div>

        <h2 style="color: var(--text-primary); margin-bottom: 1rem;">Access Denied</h2>

        <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem;">
            You don't have permission to access this resource.
        </p>

        <div class="card" style="margin-bottom: 2rem;">
            <div class="card-body">
                <p style="color: var(--text-secondary); margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <span>This page is restricted. If you believe this is an error, please contact support.</span>
                </p>
            </div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Go to Dashboard
            </a>
            <a href="javascript:history.back();" class="btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
