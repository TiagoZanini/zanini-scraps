{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="page-content" style="display: flex; align-items: center; justify-content: center; min-height: 60vh;">
    <div style="text-align: center; max-width: 500px; margin: auto;">
        <div style="margin-bottom: 2rem;">
            <h1 style="font-size: 5rem; color: var(--danger); margin: 0; font-weight: 700;">500</h1>
        </div>

        <h2 style="color: var(--text-primary); margin-bottom: 1rem;">Server Error</h2>

        <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem;">
            Something went wrong on our end. Our team has been notified.
        </p>

        <div class="card" style="margin-bottom: 2rem;">
            <div class="card-body">
                <p style="color: var(--text-secondary); margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                    <span>We're working to resolve this issue. Please try again in a few moments.</span>
                </p>
            </div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Go to Dashboard
            </a>
            <a href="javascript:location.reload();" class="btn btn-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                Refresh Page
            </a>
        </div>
    </div>
</div>
{% endblock %}
